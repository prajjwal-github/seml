# Render Blueprint for the SecureWipe backend (FastAPI + PostgreSQL).
# Render dashboard > New > Blueprint > pick this repository > Apply.
# When it is live, copy the service URL (https://securewipe-api-xxxx.onrender.com)
# into Netlify as VITE_API_URL and redeploy the Netlify site.

services:
  - type: web
    name: securewipe-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WIPE_MODE
        value: simulation
      - key: DATABASE_URL
        fromDatabase:
          name: securewipe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      # Your Netlify site URL (used for the QR verification link on certificates)
      - key: PUBLIC_APP_URL
        value: https://secure-wipe-seml.netlify.app
      - key: CORS_ORIGINS
        value: https://secure-wipe-seml.netlify.app,http://localhost:5173

databases:
  - name: securewipe-db
    plan: free
    databaseName: securewipe
    user: securewipe
