# Netlify hosts the React frontend. The FastAPI backend (Python + PostgreSQL + a
# background wipe worker + WebSockets) can't run on Netlify, so it runs on Render
# (see render.yaml) and the frontend talks to it through VITE_API_URL.
#
# In Netlify > Site configuration > Environment variables set:
#   VITE_API_URL = https://<your-backend>.onrender.com
# then trigger a redeploy.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let React Router handle /dashboard, /verify/CERT-..., etc.
# (without this, refreshing any page other than / shows Netlify's 404)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
